# Rebuilds docs/ whenever a published week file changes, e.g. after "Publish" on the admin page.
name: Build site

on:
  push:
    branches: [main]
    paths:
      - "weeks/*/week-*.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false  # a newer push waits, and only the latest waiting build runs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ffr.py build
      - run: bash .github/scripts/push.sh "Build site"
